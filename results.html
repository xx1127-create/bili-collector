<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查看结果 · B站视频采集器</title>
<style>
  :root { --pink:#fb7299; --blue:#00a1d6; --bg:#f6f7f8; --card:#fff; --line:#e3e5e7; --text:#18191c; --muted:#61666d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--blue); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:20px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; color:var(--pink); }
  nav { display:flex; gap:4px; }
  nav a { padding:4px 12px; border-radius:6px; color:var(--muted); }
  nav a.on { background:#fff0f4; color:var(--pink); font-weight:500; }
  header .stats { margin-left:auto; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 260px 1fr; gap:16px; padding:16px 20px; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  button, select, input[type=search] { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--blue); color:var(--blue); }
  button:disabled { opacity:.4; cursor:not-allowed; }

  /* 左侧类别 */
  .cats { position:sticky; top:70px; max-height:calc(100vh - 90px); overflow:auto; }
  .cats h2 { font-size:14px; margin:0 0 8px; }
  .cat { display:flex; justify-content:space-between; gap:8px; padding:4px 8px; border-radius:5px; cursor:pointer; }
  .cat:hover { background:#f1f2f3; }
  .cat.on { background:#fff0f4; color:var(--pink); font-weight:500; }
  .cat .n { color:var(--muted); font-size:12px; flex-shrink:0; }
  .cat.on .n { color:var(--pink); }
  .empty-cats { color:var(--muted); font-size:13px; }
  .orphans { background:#fff7e6; border:1px solid #ffd591; border-radius:6px; padding:8px 10px; margin-bottom:10px; font-size:12px; color:#874d00; }
  .orphans ul { margin:4px 0 6px; padding-left:16px; }
  .orphans button { font-size:12px; padding:3px 8px; }

  /* 工具条 */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:5px 16px; }
  .seg button.on { background:var(--pink); color:#fff; }
  .toolbar input[type=search] { width:220px; }
  .toolbar .total { color:var(--muted); margin-left:auto; }
  .crumb { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .crumb b { color:var(--text); }

  /* 表格 */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:8px; border-bottom:1px solid #f1f2f3; vertical-align:top; }
  tr:hover td { background:#fafbfc; }
  td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  th.num { text-align:right; }
  td.nowrap { white-space:nowrap; color:var(--muted); }
  .title { font-weight:500; }
  .sub { margin-top:3px; display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:0 6px; border-radius:3px; background:#eef6fb; color:#0a7aa6; white-space:nowrap; }
  .chip.kw { background:#f4f4f5; color:var(--muted); }
  .chip.hit { background:#fff0f4; color:var(--pink); }
  .up { color:var(--blue); cursor:pointer; }
  .up:hover { text-decoration:underline; }
  .status { font-size:12px; padding:1px 6px; border-radius:3px; white-space:nowrap; }
  .st-已完成 { background:#e8f7ef; color:#0b9b5e; }
  .st-失败 { background:#fdecec; color:#e04848; }
  .st-未完成 { background:#fff4e5; color:#e07b00; }
  .st-未展开 { background:#f1f2f3; color:var(--muted); }
  .sf-通过 { background:#e8f7ef; color:#0b9b5e; }
  .sf-淘汰 { background:#fdecec; color:#e04848; }
  .sf-待定 { background:#fff4e5; color:#e07b00; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; color:var(--muted); }
  .placeholder { text-align:center; color:var(--muted); padding:40px 0; }

  /* 频道详情抽屉 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:10; display:none; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(760px, 100vw); background:var(--bg); z-index:11; display:none; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,.15); }
  .drawer.open, .mask.open { display:flex; }
  .drawer .head { background:var(--card); padding:14px 18px; border-bottom:1px solid var(--line); }
  .drawer .head h3 { margin:0 0 4px; font-size:17px; display:flex; align-items:center; gap:10px; }
  .drawer .head .meta { color:var(--muted); font-size:13px; display:flex; gap:14px; flex-wrap:wrap; }
  .drawer .close { margin-left:auto; }
  .drawer .body { flex:1; overflow:auto; padding:14px 18px; }
</style>
</head>
<body>
<header>
  <h1>B站视频采集器</h1>
  <nav><a href="/">采集</a><a href="/results" class="on">查看结果</a><a href="/filter">筛选</a></nav>
  <span class="stats" id="stats"></span>
</header>
<main>
  <aside class="card cats">
    <div class="orphans" id="orphans" hidden></div>
    <h2>按类别筛选</h2>
    <div id="cats"></div>
  </aside>
  <section class="card">
    <div class="crumb" id="crumb"></div>
    <div class="toolbar">
      <span class="seg"><button id="tabVideos" onclick="setView('videos')">视频</button><button id="tabChannels" onclick="setView('channels')">频道</button></span>
      <input type="search" id="q" placeholder="搜索标题 / UP主 / 标签">
      <select id="sort"></select>
      <span class="total" id="total"></span>
    </div>
    <div id="table"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="head">
    <h3><span id="dName"></span><a id="dLink" target="_blank" style="font-size:13px;color:var(--blue);font-weight:normal">打开B站主页 ↗</a><button class="close" onclick="closeDrawer()">关闭</button></h3>
    <div class="meta" id="dMeta"></div>
  </div>
  <div class="body">
    <div class="toolbar">
      <input type="search" id="dq" placeholder="在这个频道里搜索标题">
      <select id="dsort"><option value="pubdate">最新发布</option><option value="play">最多播放</option></select>
      <span class="total" id="dTotal"></span>
    </div>
    <div id="dTable"></div>
    <div class="pager" id="dPager"></div>
  </div>
</aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '—' : n >= 1e8 ? (n/1e8).toFixed(1) + '亿' : n >= 1e4 ? (n/1e4).toFixed(1) + '万' : String(n);
const last = p => p.split(' > ').pop();
const SORTS = {
  videos: [['play','最多播放'], ['pubdate','最新发布'], ['found','最近抓到']],
  channels: [['hits','搜索命中最多'], ['fans','粉丝最多'], ['videos','视频最多']],
};
const st = { view: 'videos', category: '', q: '', sort: 'play', page: 1 };
const ds = { mid: null, q: '', sort: 'pubdate', page: 1 };
const SIZE = 50;

async function get(url, params) {
  const r = await fetch(url + '?' + new URLSearchParams(params));
  return r.json();
}

function pager(el, total, page, go) {
  const pages = Math.max(1, Math.ceil(total / SIZE));
  el.innerHTML = total <= SIZE ? '' :
    `<button ${page <= 1 ? 'disabled' : ''} data-p="${page - 1}">上一页</button>
     <span>第 ${page} / ${pages} 页</span>
     <button ${page >= pages ? 'disabled' : ''} data-p="${page + 1}">下一页</button>`;
  el.querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.p));
}

// ---------- 类别 ----------
async function loadCats() {
  const cats = await get('/api/results/categories', {});
  const total = cats.filter(c => !c.path.includes(' > ')).reduce((a, c) => a + c.count, 0);
  $('cats').innerHTML = !cats.length ? '<div class="empty-cats">还没有搜索结果。去「采集」页勾选类别，开始抓取。</div>' :
    `<div class="cat ${st.category === '' ? 'on' : ''}" data-p=""><span>全部</span><span class="n">${total}</span></div>` +
    cats.map(c => {
      const depth = c.path.split(' > ').length;
      return `<div class="cat ${st.category === c.path ? 'on' : ''}" data-p="${esc(c.path)}" style="padding-left:${8 + (depth - 1) * 14}px" title="${esc(c.path)}">
        <span>${esc(last(c.path))}</span><span class="n">${c.count}</span></div>`;
    }).join('');
  $('cats').querySelectorAll('.cat').forEach(el => el.onclick = () => { st.category = el.dataset.p; st.page = 1; loadCats(); load(); });
}

async function loadOrphans() {
  const list = await get('/api/results/orphans', {});
  const el = $('orphans');
  el.hidden = !list.length;
  if (!list.length) return;
  el.innerHTML = `这些类别已经不在你的类别树里（删掉或改名了）：
    <ul>${list.map(o => `<li>${esc(o.category)}（${o.videos} 个视频）</li>`).join('')}</ul>
    <button id="pruneBtn">清理掉</button>`;
  $('pruneBtn').onclick = async () => {
    if (!confirm('删掉这些类别的搜索结果？\n只因为这些类别被搜到的频道，会连同它的视频和筛选记录一起删掉，不能恢复。')) return;
    const r = await (await fetch('/api/results/prune', {method: 'POST'})).json();
    if (r.error) return alert(r.error);
    alert(`已清理：${r.hits} 条搜索命中，${r.channels} 个频道，${r.videos} 个视频`);
    st.category = ''; st.page = 1;
    loadOrphans(); loadCats(); load();
  };
}

// ---------- 列表 ----------
function setView(v) {
  st.view = v; st.page = 1;
  st.sort = SORTS[v][0][0];
  $('sort').innerHTML = SORTS[v].map(([k, t]) => `<option value="${k}">${t}</option>`).join('');
  $('tabVideos').classList.toggle('on', v === 'videos');
  $('tabChannels').classList.toggle('on', v === 'channels');
  $('q').placeholder = v === 'videos' ? '搜索标题 / UP主 / 标签' : '搜索 UP主名字';
  load();
}

async function load() {
  $('crumb').innerHTML = st.category ? `当前类别：<b>${esc(st.category)}</b>（含子类）` : '当前类别：<b>全部</b>';
  const d = await get('/api/results/' + st.view, {category: st.category, q: st.q, sort: st.sort, page: st.page, size: SIZE});
  $('total').textContent = `共 ${d.total} ${st.view === 'videos' ? '个视频' : '个频道'}`;
  if (!d.rows.length) $('table').innerHTML = '<div class="placeholder">没有符合条件的结果</div>';
  else if (st.view === 'videos') $('table').innerHTML = `<table>
    <tr><th>视频</th><th>UP主</th><th class="num">播放</th><th>发布</th><th>时长</th></tr>
    ${d.rows.map(v => `<tr>
      <td><a class="title" href="${esc(v.url)}" target="_blank">${esc(v.title)}</a>
        <div class="sub">${v.cats.map(c => `<span class="chip" title="${esc(c)}">${esc(last(c))}</span>`).join('')}
          ${v.kws.map(k => `<span class="chip kw">搜：${esc(k)}</span>`).join('')}</div></td>
      <td class="nowrap"><span class="up" data-mid="${v.mid}">${esc(v.author)}</span></td>
      <td class="num">${fmt(v.play)}</td><td class="nowrap">${esc(v.pubdate)}</td><td class="nowrap">${esc(v.duration)}</td>
    </tr>`).join('')}</table>`;
  else $('table').innerHTML = `<table>
    <tr><th>UP主</th><th class="num">粉丝</th><th class="num">视频总数</th><th class="num">已取</th><th class="num">搜索命中</th><th>命中类别</th><th>展开状态</th><th>筛选</th></tr>
    ${d.rows.map(c => `<tr>
      <td><span class="up title" data-mid="${c.mid}">${esc(c.name)}</span></td>
      <td class="num">${fmt(c.fans)}</td><td class="num">${c.total_videos ?? '—'}</td><td class="num">${c.fetched_videos ?? '—'}</td>
      <td class="num">${c.hit_count}</td>
      <td><div class="sub" style="margin:0">${c.cats.map(x => `<span class="chip" title="${esc(x)}">${esc(last(x))}</span>`).join('')}</div></td>
      <td><span class="status st-${esc(c.status)}">${esc(c.status)}</span></td>
      <td>${c.decision ? `<a href="/filter" class="status sf-${esc(c.decision)}" title="${c.decision === '待定' ? '下次采集会展开' : '已有筛选记录，下次采集不再抓取'}">${{'通过': '入选', '淘汰': '筛掉', '待定': '待定'}[c.decision]}${c.decision === '待定' ? '' : ' · 不再抓取'}</a>` : '<span class="status st-未展开">未筛选</span>'}</td>
    </tr>`).join('')}</table>`;
  $('table').querySelectorAll('.up').forEach(el => el.onclick = () => openDrawer(+el.dataset.mid));
  pager($('pager'), d.total, st.page, p => { st.page = p; load(); scrollTo(0, 0); });
}

// ---------- 频道详情 ----------
function openDrawer(mid) {
  Object.assign(ds, {mid, q: '', sort: 'pubdate', page: 1});
  $('dq').value = ''; $('dsort').value = 'pubdate';
  $('drawer').classList.add('open'); $('mask').classList.add('open');
  loadDrawer();
}
function closeDrawer() { $('drawer').classList.remove('open'); $('mask').classList.remove('open'); }
async function loadDrawer() {
  const d = await get('/api/results/channel/' + ds.mid, {q: ds.q, sort: ds.sort, page: ds.page, size: SIZE});
  const c = d.channel || {name: ds.mid, mid: ds.mid};
  $('dName').textContent = c.name;
  $('dLink').href = `https://space.bilibili.com/${c.mid}`;
  $('dMeta').innerHTML = `<span>粉丝 ${fmt(c.fans)}</span><span>B站上视频 ${c.total_videos ?? '?'} 个</span>
    <span>已抓到 ${d.total} 个</span>${c.status ? `<span class="status st-${esc(c.status)}">${esc(c.status)}</span>` : ''}
    ${c.status !== '已完成' ? '<span>（频道没完全展开，这里只有已抓到的视频）</span>' : ''}`;
  $('dTotal').textContent = `共 ${d.total} 个`;
  $('dTable').innerHTML = !d.rows.length ? '<div class="placeholder">没有视频</div>' : `<table>
    <tr><th>标题</th><th class="num">播放</th><th>发布</th><th>时长</th></tr>
    ${d.rows.map(v => `<tr>
      <td><a class="title" href="${esc(v.url)}" target="_blank">${esc(v.title)}</a>
        ${v.is_hit ? '<span class="chip hit">搜索命中</span>' : ''}</td>
      <td class="num">${fmt(v.play)}</td><td class="nowrap">${esc(v.pubdate)}</td><td class="nowrap">${esc(v.duration)}</td>
    </tr>`).join('')}</table>`;
  pager($('dPager'), d.total, ds.page, p => { ds.page = p; loadDrawer(); $('drawer').querySelector('.body').scrollTop = 0; });
}

// ---------- 事件 ----------
let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { st.q = $('q').value.trim(); st.page = 1; load(); }, 300); };
$('sort').onchange = () => { st.sort = $('sort').value; st.page = 1; load(); };
$('dq').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { ds.q = $('dq').value.trim(); ds.page = 1; loadDrawer(); }, 300); };
$('dsort').onchange = () => { ds.sort = $('dsort').value; ds.page = 1; loadDrawer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

(async () => {
  const s = await (await fetch('/api/status')).json();
  $('stats').textContent = `视频 ${s.stats.videos} · 搜索命中 ${s.stats.hits} · 频道 ${s.stats.channels}（已抓全 ${s.stats.channels_done}，没抓全 ${s.stats.channels - s.stats.channels_done}）`;
  loadOrphans();
  loadCats();
  setView('videos');
})();
</script>
</body>
</html>
